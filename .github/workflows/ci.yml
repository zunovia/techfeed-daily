name: CI
on:
  push:
    # 既定ブランチは master。[main] のままでは push で一度も動かなかった。
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm -r run build に worker の wrangler が含まれる。
          # Wrangler は Node 22 以上が必須（deploy-worker.yml と揃える）。
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @techfeed/shared build
      - run: npx biome check .
      - run: pnpm -r run build
      - run: pnpm -r run test
