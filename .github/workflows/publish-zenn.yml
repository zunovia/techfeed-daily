name: Publish to Zenn

# 毎朝、その日の記事を zenn-content リポジトリへ自動送信する（＝Step1を自動化）。
# Zenn上での公開(Deploy)は手動運用のまま（ダッシュボードでDeployボタンを押す）。
# 1日1回のみ送信するのでZennのレート制限に優しい。手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: '30 22 * * *' # 07:30 JST（日次パイプライン完了後）
  workflow_dispatch:

jobs:
  publish-zenn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Publish to Zenn
        run: pnpm tsx scripts/publish-zenn.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.ZENN_GITHUB_TOKEN }}
