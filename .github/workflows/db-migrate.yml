name: D1 Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file name (e.g., 0001_initial.sql). Must be a .sql filename only (no path separators).'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate migration file input
        run: |
          MIGRATION_FILE="${{ github.event.inputs.migration_file }}"
          # Reject any path traversal attempts or directory separators
          if echo "$MIGRATION_FILE" | grep -qE '[\\/]|\.\.'; then
            echo "Error: migration_file must be a plain filename with no path separators."
            exit 1
          fi
          # Require .sql extension
          if ! echo "$MIGRATION_FILE" | grep -qE '^[a-zA-Z0-9_-]+\.sql$'; then
            echo "Error: migration_file must match pattern [a-zA-Z0-9_-]+.sql"
            exit 1
          fi
          echo "MIGRATION_FILE=$MIGRATION_FILE" >> "$GITHUB_ENV"
      - name: Apply migration via migrate script
        run: npx tsx scripts/migrate.ts "migrations/$MIGRATION_FILE"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
