name: Daily Tech Article Pipeline
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @techfeed/shared build
      - run: pnpm --filter @techfeed/collector build
      - run: node packages/collector/dist/index.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

  summarize:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @techfeed/shared build
      - run: pnpm --filter @techfeed/summarizer build
      - run: node packages/summarizer/dist/index.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

  publish:
    needs: summarize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @techfeed/shared build
      - run: pnpm --filter @techfeed/collector build
      - run: pnpm --filter @techfeed/publisher build
      - run: node packages/publisher/dist/index.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

  # notify (X posting) - disabled: X API Free plan discontinued (Feb 2026)
  # To re-enable, uncomment and set X_API_KEY/SECRET/ACCESS_TOKEN/SECRET secrets
  # notify:
  #   needs: publish
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   timeout-minutes: 5
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'pnpm'
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm --filter @techfeed/shared build
  #     - run: pnpm --filter @techfeed/collector build
  #     - name: Post to X
  #       run: npx tsx scripts/post-x.ts
  #       env:
  #         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  #         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #         D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  #         X_API_KEY: ${{ secrets.X_API_KEY }}
  #         X_API_SECRET: ${{ secrets.X_API_SECRET }}
  #         X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  #         X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

  # publish-zenn - disabled from daily pipeline (2026/05/28)
  # Zenn rate limit blocks auto-deploy, wasting quota and causing 1-day delay.
  # Use the separate "Publish to Zenn" workflow (publish-zenn.yml) to trigger manually.

  notify-failure:
    needs: [collect, summarize, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
            -d "{\"text\":\"TechFeed Daily pipeline failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── keepalive ────────────────────────────────────────────────────────────
  # 公開リポジトリのスケジュール実行は、60日間コミットが無いと GitHub が自動で
  # 無効化する。止まるのは Zenn だけでなく、この日次パイプライン本体も同じ。
  # 45日を超えていたら空コミットを1つ積んでカウンタを戻す（15日の余裕を見る）。
  #
  # - パイプラインの成否と切り離してある（needs 無し）。失敗が続いている時こそ止めたくない
  # - GITHUB_TOKEN による push は on:push のワークフローを起動しないため、
  #   Deploy Worker が誤って走ることはない（空コミットなので paths にも当たらない）
  # - リポジトリ既定のトークン権限が read のため、ここで contents: write を明示する
  keepalive:
    if: github.repository == 'zunovia/techfeed-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Measure how long the repository has been idle
        id: idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pushed=$(gh api "repos/${{ github.repository }}" --jq .pushed_at)
          age=$(( ( $(date +%s) - $(date -d "$pushed" +%s) ) / 86400 ))
          echo "last push: $pushed (${age} days ago)"
          echo "age=$age" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: fromJSON(steps.idle.outputs.age) >= 45

      - name: Push an empty commit to reset the 60-day timer
        if: fromJSON(steps.idle.outputs.age) >= 45
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keepalive (scheduled workflows are disabled after 60 days idle)'
          git push
