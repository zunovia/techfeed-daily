name = "techfeed-daily"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Keep the original *.workers.dev URL enabled (adding `routes` disables it by default,
# which would break existing RSS/API consumers and Zenn article links).
workers_dev = true

# Custom domain — serves the site at news.surc.online (apex surc.online stays on Vercel).
# Requires the surc.online zone to live in the same Cloudflare account as this Worker
# and the deploy API token to have Zone DNS + Workers Routes edit permissions.
routes = [
  { pattern = "news.surc.online", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "KV"
id = "e80a7fda966d45caa629f0df14ba39f3"

[[d1_databases]]
binding = "DB"
database_name = "techfeed-daily-db"
database_id = "252d3a54-282d-419f-a105-b9d8e16f9ed5"

# Workers AI — used for the hero image generation (/img/hero/:date)
[ai]
binding = "AI"

[build]
command = ""
